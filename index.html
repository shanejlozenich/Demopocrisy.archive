---
layout: default
title: Home
---

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demopocrisy Archive</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #f9f9f9;
            --grid-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --accent-crimson: #eb153c;
            --border-color: #dddddd;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Archivo', sans-serif;
            margin: 0;
            padding: 2rem;
        }

        header {
            border-bottom: 2px solid var(--accent-crimson);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: 'Gloock', serif;
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
            letter-spacing: -1px;
        }

        .meta-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .controls {
            margin-bottom: 1.5rem;
        }

        #searchBar {
            width: 100%;
            max-width: 400px;
            background-color: var(--grid-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem;
            font-size: 1rem;
            outline: none;
        }

        #searchBar:focus {
            border-color: var(--accent-crimson);
        }

        .archive-table-container {
            overflow-x: auto;
            background-color: var(--grid-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #f1f1f1;
            border-bottom: 2px solid var(--border-color);
            padding: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
        }

        tr:hover {
            background-color: #fcfcfc;
        }

        .doc-link {
            color: var(--accent-crimson);
            text-decoration: none;
            font-weight: bold;
        }

        .doc-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header>
    <h1>DEMOPOCRISY</h1>
    <div class="meta-subtitle">Institutional Architecture & Document Log Mapping</div>
</header>

<div class="controls">
    <input type="text" id="searchBar" placeholder="FILTER BY CASE, DATE, OR KEYWORD..." onkeyup="filterTable()">
</div>

<div class="archive-table-container">
    <table id="archiveTable">
        <thead>
            <tr id="tableHeader">
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr>
                <td colspan="4" style="color: var(--text-muted);">Initializing stratigraphic record layer...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const csvUrl = 'data/archive_metadata.csv';

    function loadArchive() {
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                renderTable(results.data);
            },
            error: function(err) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" style="color: var(--accent-crimson);">CSV data link pending. Ready for data injection.</td></tr>`;
            }
        });
    }

    function renderTable(data) {
        if(data.length === 0) return;
        
        const headers = Object.keys(data[0]);
        const headerRow = document.getElementById('tableHeader');
        headerRow.innerHTML = headers.map(h => `<th>${h}</th>`).join('');

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = data.map(row => {
            return `<tr>` + headers.map(h => {
                let cellValue = row[h] || '';
                if (cellValue.includes('http') || cellValue.endsWith('.pdf')) {
                    return `<td><a class="doc-link" href="${cellValue}" target="_blank">VIEW DOCUMENT</a></td>`;
                }
                return `<td>${cellValue}</td>`;
            }).join('') + `</tr>`;
        }).join('');
    }

    function filterTable() {
        let input = document.getElementById("searchBar").value.toUpperCase();
        let rows = document.getElementById("tableBody").getElementsByTagName("tr");
        for (let i = 0; i < rows.length; i++) {
            let cells = rows[i].getElementsByTagName("td");
            let match = false;
            for(let j=0; j < cells.length; j++) {
                if (cells[j] && cells[j].innerText.toUpperCase().indexOf(input) > -1) {
                    match = true;
                    break;
                }
            }
            rows[i].style.display = match ? "" : "none";
        }
    }

    window.onload = loadArchive;
</script>

</body>
</html>
